              <div>
                <div className="grid grid-cols-3 gap-3 mb-5">
                  <div className="rounded-2xl p-4" style={{ background: "rgba(246,239,221,0.06)" }}>
                    <p className="text-xs mb-1" style={{ color: MUTED_CREAM }}>
                      Overall accuracy
                    </p>
                    <p className="text-3xl font-bold" style={{ color: CREAM, fontFamily: "'Fraunces', serif" }}>
                      {overallPct === null ? "—" : `${overallPct}%`}
                    </p>
                    <p className="text-xs mt-1" style={{ color: MUTED_CREAM }}>
                      {["pair", "suited", "offsuit"].reduce((s, k) => s + history.aggregate[k].correct, 0)}/
                      {["pair", "suited", "offsuit"].reduce((s, k) => s + history.aggregate[k].total, 0)} hands
                    </p>
                  </div>
                  <div className="rounded-2xl p-4" style={{ background: "rgba(246,239,221,0.06)" }}>
                    <p className="text-xs mb-1" style={{ color: MUTED_CREAM }}>
                      Last run
                    </p>
                    <p className="text-3xl font-bold" style={{ color: GOLD, fontFamily: "'Fraunces', serif" }}>
                      {lastRunPct === null ? "—" : `${lastRunPct}%`}
                    </p>
                    <p className="text-xs mt-1" style={{ color: MUTED_CREAM }}>
                      {lastRun ? `${lastRun.correct}/${lastRun.total} hands` : "No runs yet"}
                    </p>
                  </div>
                  <div className="rounded-2xl p-4" style={{ background: "rgba(207,168,75,0.1)" }}>
                    <p className="text-xs mb-1 flex items-center gap-1" style={{ color: MUTED_CREAM }}>
                      <Trophy size={11} color={GOLD} />
                      Flawless runs
                    </p>
                    <p className="text-3xl font-bold" style={{ color: GOLD, fontFamily: "'Fraunces', serif" }}>
                      {history.flawlessRuns || 0}
                    </p>
                    <p className="text-xs mt-1" style={{ color: MUTED_CREAM }}>
                      No mistakes, start to finish
                    </p>
                  </div>
                </div>

                <p className="text-sm mb-2" style={{ color: CREAM }}>
                  Accuracy trend
                </p>
                <div className="mb-6">
                  <AccuracyTrend runs={history.runs} />
                </div>

                <p className="text-sm mb-2" style={{ color: CREAM }}>
                  Breakdown
                </p>
                <div className="mb-6">
                  <CategoryTable overall={history.aggregate} last={lastRun ? lastRun.cats : null} />
                </div>

                <p className="text-sm mb-2" style={{ color: CREAM }}>By position</p>
                {rated.length >= 2 && (
                  <p className="text-xs mb-2" style={{ color: MUTED_CREAM }}>
                    Weakest: {rated[0].position} ({Math.round(rated[0].acc * 100)}%) · Strongest: {rated[rated.length - 1].position} ({Math.round(rated[rated.length - 1].acc * 100)}%)
                  </p>
                )}
                <div className="rounded-xl overflow-hidden mb-6" style={{ background: "rgba(246,239,221,0.06)" }}>
                  {insights.map((r) => {
                    const acc = pct(Math.round(r.correct * 2) / 2, r.total);
                    return (
                      <div key={r.position} className="px-4 py-3" style={{ borderBottom: "1px solid rgba(246,239,221,0.06)" }}>
                        <div className="flex items-center justify-between text-sm" style={{ color: CREAM }}>
                          <span>
                            {r.position} <span className="text-xs" style={{ color: MUTED_CREAM }}>{POSITION_LABEL[r.position]}</span>
                          </span>
                          <span style={{ color: acc === null ? MUTED_CREAM : GOLD }}>{acc === null ? "—" : `${acc}%`}</span>
                        </div>
                        {acc !== null && (
                          <div className="mt-2">
                            <ProgressBar value={acc} max={100} />
                            <p className="text-xs mt-1.5" style={{ color: MUTED_CREAM }}>
                              {r.mastered} mastered · {r.total} answers
                              {r.weakest ? ` · weakest ${r.weakest.notation} (${Math.round(r.weakest.acc * 100)}%)` : ""}
                            </p>
                            {r.topMiss && (
                              <p className="text-xs mt-0.5" style={{ color: MUTED_CREAM }}>
                                Most common miss: {ACTION_WORD[r.topMiss.chose]} instead of {ACTION_WORD[r.topMiss.right]} ({r.topMiss.n}×)
                              </p>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                <p className="text-sm mb-2" style={{ color: CREAM }}>
                  Accuracy by hand
                </p>
                <p className="text-xs mb-2" style={{ color: MUTED_CREAM }}>
                  Tap any tile for the full breakdown on that hand.
                </p>
                <div className="rounded-xl p-3 mb-6" style={{ background: "rgba(246,239,221,0.06)" }}>
                  <div className="flex gap-2 mb-3">
                    {POSITIONS.map((p) => (
                      <TabButton key={p} active={heatmapPos === p} onClick={() => setHeatmapPos(p)}>
                        {p}
                      </TabButton>
                    ))}
                  </div>
                  <AccuracyHeatmap
                    position={heatmapPos}
                    handStats={history.handStats || {}}
                    onSelectHand={(hand) => setInspectedHand({ ...hand, suits: assignSuits(hand.category) })}
                  />
                </div>

                <p className="text-sm mb-2" style={{ color: CREAM }}>
                  Run log
                </p>
                <div className="rounded-xl overflow-hidden mb-6" style={{ background: "rgba(246,239,221,0.06)" }}>
                  {history.runs.length === 0 && (
                    <p className="text-sm px-4 py-4" style={{ color: MUTED_CREAM }}>
                      Finish a run to see it logged here.
                    </p>
                  )}
                  {history.runs.slice(0, 10).map((r) => (
                    <div
                      key={r.id}
                      className="flex items-center justify-between px-4 py-2.5 text-sm"
                      style={{ color: CREAM, borderBottom: "1px solid rgba(246,239,221,0.06)" }}
                    >
                      <span style={{ color: MUTED_CREAM }}>
                        {new Date(r.timestamp).toLocaleDateString(undefined, { month: "short", day: "numeric" })}{" "}
                        {new Date(r.timestamp).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}
                      </span>
                      <span className="flex items-center gap-1.5">
                        {r.flawless && (
                          <span
                            className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full"
                            style={{ background: "rgba(207,168,75,0.18)", color: GOLD }}
                          >
                            Flawless
                          </span>
                        )}
                        {r.correct}/{r.total} · {pct(r.correct, r.total)}%
                      </span>
                    </div>
                  ))}
                </div>

                {!hasStorage && (
                  <p className="text-xs mb-4" style={{ color: MUTED_CREAM }}>
                    Storage isn't available in this preview, so history will reset when you close this.
                  </p>
                )}

                <button
                  onClick={doReset}
                  onBlur={() => setResetConfirm(false)}
                  className="w-full rounded-2xl py-3 flex items-center justify-center gap-2 text-sm font-medium"
                  style={{
                    background: resetConfirm ? FOLD_BG : "rgba(246,239,221,0.1)",
                    color: resetConfirm ? "#ffffff" : CREAM,
                  }}
                >
                  <RotateCcw size={14} />
                  {resetConfirm ? "Confirm reset — this can't be undone" : "Reset history"}
                </button>
              </div>
            )}

            {ready && activeTab === "settings" && (
              <div>
                <div className="rounded-2xl p-4 mb-4" style={{ background: "rgba(246,239,221,0.06)" }}>
                  <div className="flex items-center justify-between">
                    <div>
                      <p className="text-sm font-medium" style={{ color: CREAM }}>
                        Auto-advance
                      </p>
                      <p className="text-xs mt-0.5" style={{ color: MUTED_CREAM }}>
                        Skip to the next hand automatically after a correct answer.
                      </p>
                    </div>
                    <ToggleSwitch
                      checked={settings.autoAdvance}
                      onChange={(v) => updateSettings({ autoAdvance: v })}
                      label=""
                    />
                  </div>
                </div>

                <div className="rounded-2xl p-4 mb-4" style={{ background: "rgba(246,239,221,0.06)" }}>
                  <p className="text-sm font-medium mb-1" style={{ color: CREAM }}>
                    Animation speed
                  </p>
                  <p className="text-xs mb-3" style={{ color: MUTED_CREAM }}>
                    Controls how fast the deal-in, right/wrong effects, and auto-advance delay play out.
                  </p>
                  <div className="flex gap-2">
                    {Object.entries(SPEED_PRESETS).map(([key, preset]) => {
                      const active = settings.animationSpeed === key;
                      return (
                        <button
                          key={key}
                          onClick={() => updateSettings({ animationSpeed: key })}
                          className="flex-1 rounded-xl py-2.5 px-2 flex flex-col items-center transition"
                          style={{
                            background: active ? CREAM : "rgba(246,239,221,0.1)",
                            color: active ? INK : CREAM,
                          }}
                        >
                          <span className="text-sm font-semibold">{preset.label}</span>
                          <span
                            className="text-[10px] mt-0.5 text-center"
                            style={{ color: active ? "rgba(32,36,31,0.65)" : MUTED_CREAM }}
                          >
                            {preset.blurb}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="rounded-2xl p-4 mb-4" style={{ background: "rgba(246,239,221,0.06)" }}>
                  <p className="text-sm font-medium mb-1" style={{ color: CREAM }}>Positions to practice</p>
                  <p className="text-xs mb-3" style={{ color: MUTED_CREAM }}>Applies from your next run. At least one stays on.</p>
                  <div className="flex gap-2">
                    {POSITIONS.map((p) => {
                      const on = (settings.positions || POSITIONS).includes(p);
                      return (
                        <button
                          key={p}
                          onClick={() => togglePosition(p)}
                          className="flex-1 rounded-xl py-2.5 flex flex-col items-center transition"
                          style={{ background: on ? CREAM : "rgba(246,239,221,0.1)", color: on ? INK : CREAM }}
                        >
                          <span className="text-sm font-semibold">{p}</span>
                          <span className="text-[10px] mt-0.5" style={{ color: on ? "rgba(32,36,31,0.65)" : MUTED_CREAM }}>{POSITION_LABEL[p]}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <p className="text-xs px-1" style={{ color: MUTED_CREAM }}>
                  More settings will land here as the trainer grows.
                </p>
              </div>
            )}
          </main>

          {inspectedHand && <HandInspectorModal hand={inspectedHand} onClose={() => setInspectedHand(null)} />}
        </div>
      );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PokerEVTrainer />);
  </script>
</body>
</html>
