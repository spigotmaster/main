<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Felt — Preflop Range Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--felt:#123527;--felt-deep:#0B241A;--cream:#F6EFDD;--ink:#20241F;--gold:#CFA84B;--raise:#2E8B63;--call:#D7A73B;--call-text:#2A2005;--fold:#B8463B;--muted:rgba(246,239,221,.62);--purple:#8B6FD1;--lavender:#C9AEF2;--redemption:#4FB6C7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--felt-deep)}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--cream)}
button{font:inherit;border:0;cursor:pointer}button:disabled{cursor:default}
#app{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;background:radial-gradient(ellipse at top,var(--felt) 0%,var(--felt-deep) 78%)}
.shell{width:100%;max-width:448px;flex:1}
header{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
h1,h2,.serif{font-family:Fraunces,serif}h1{font-size:24px;line-height:1;margin:0;font-weight:600}
.subtitle,.muted{color:var(--muted)}.subtitle{font-size:12px;margin-top:5px}
nav{display:flex;gap:8px}.tab{padding:8px 16px;border-radius:999px;background:rgba(246,239,221,.12);color:var(--cream);font-size:13px;font-weight:500}.tab.active{background:var(--cream);color:var(--ink)}
.card{background:rgba(246,239,221,.06);border-radius:16px}.panel{background:rgba(0,0,0,.18);border:1px solid rgba(207,168,75,.25);border-radius:24px}
.row{display:flex;align-items:center;justify-content:space-between}.gap{gap:12px}.mt8{margin-top:32px}.mb{margin-bottom:16px}
.progress{height:6px;border-radius:999px;overflow:hidden;background:rgba(246,239,221,.15)}.progress>div{height:100%;background:var(--gold);border-radius:999px;transition:width .25s}
.deal{display:flex;flex-direction:column;align-items:center;padding:32px 16px;position:relative}.deal-in{animation:dealIn var(--dur-deal,132ms) ease-out}
.cards{display:flex;gap:12px;margin-bottom:20px}.mini-card{width:88px;height:120px;background:var(--cream);border:2px solid rgba(32,36,31,.15);border-radius:8px;box-shadow:0 8px 18px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none}.rank{font-size:30px;font-weight:600;line-height:1}.suit{font-size:24px;line-height:1;margin-top:5px}
.notation{padding:6px 20px;border-radius:999px;background:rgba(246,239,221,.1);color:var(--gold);font:600 20px Fraunces,serif;letter-spacing:.04em}
.actions{display:flex;gap:12px;margin-bottom:16px}.chip{flex:1;border-radius:16px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:.15s}.chip.raise{background:var(--raise);color:#fff}.chip.call{background:var(--call);color:var(--call-text)}.chip.fold{background:var(--fold);color:#fff}.chip.chosen{box-shadow:0 0 0 3px var(--cream),0 2px 8px rgba(0,0,0,.4)}.chip.hint{box-shadow:0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.4)}.chip.dim{opacity:.45}.chip:disabled{opacity:inherit}
.chip-label{font-size:16px;font-weight:600}.chip-sub{font-size:11px;margin-top:2px;opacity:.8}
.feedback{display:flex;align-items:center;justify-content:space-between;border-radius:16px;padding:12px 16px;margin-bottom:16px;background:rgba(246,239,221,.08);font-size:14px}
.primary,.secondary{width:100%;border-radius:16px;padding:12px;font-weight:500}.primary{background:var(--cream);color:var(--ink)}.secondary{background:rgba(246,239,221,.12);color:var(--cream)}.primary:disabled{opacity:.3}
.banner{border-radius:16px;padding:12px 16px;margin-bottom:16px;background:rgba(79,182,199,.12);border:1px solid rgba(79,182,199,.35)}.banner-title{color:var(--redemption);font-size:14px;font-weight:600}.banner p{font-size:12px;margin:4px 0 0;color:var(--muted)}
.summary{text-align:center;padding-top:24px}.summary h2{font-size:21px;margin:0 0 4px}.score{font:700 40px Fraunces,serif;color:var(--gold)}.summary .small{font-size:14px;color:var(--muted);margin-bottom:24px}
.table{overflow:hidden;border-radius:12px;background:rgba(246,239,221,.06)}.table-head,.table-row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 16px}.table-head{font-size:12px;color:var(--muted);border-bottom:1px solid rgba(246,239,221,.12)}.table-row{font-size:14px;color:var(--cream);border-bottom:1px solid rgba(246,239,221,.06)}.right{text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat{padding:16px;border-radius:16px;background:rgba(246,239,221,.06)}.stat-label{font-size:12px;color:var(--muted);margin-bottom:4px}.stat-value{font:700 30px Fraunces,serif;color:var(--cream)}.stat.gold .stat-value{color:var(--gold)}.stat p{font-size:12px;color:var(--muted);margin:4px 0 0}
.section-label{font-size:14px;color:var(--cream);margin:0 0 8px}.chart{border-radius:12px;background:rgba(246,239,221,.06);padding:12px;margin-bottom:20px}.heat-wrap{overflow-x:auto}.heat{display:grid;grid-template-columns:22px repeat(13,minmax(20px,1fr));gap:3px;min-width:400px}.heat-label{font-size:9px;color:var(--muted);display:flex;align-items:center;justify-content:center}.heat-col{text-align:center;font-size:9px;color:var(--muted);padding-bottom:4px}.heat-cell{width:100%;aspect-ratio:1;border-radius:3px;border:1px solid rgba(0,0,0,.18)}.legend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:10px;color:var(--muted)}.gradient{height:8px;flex:1;border-radius:999px;background:linear-gradient(to right,var(--fold),var(--call),var(--raise))}
.runlog{overflow:hidden;border-radius:12px;background:rgba(246,239,221,.06);margin-bottom:24px}.runitem{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:14px;border-bottom:1px solid rgba(246,239,221,.06)}.flawless-tag{font-size:10px;font-weight:600;padding:3px 6px;border-radius:999px;background:rgba(207,168,75,.18);color:var(--gold)}
.setting{padding:16px;border-radius:16px;background:rgba(246,239,221,.06);margin-bottom:16px}.setting-title{font-size:14px;font-weight:500}.setting-desc{font-size:12px;color:var(--muted);margin-top:3px}.toggle{width:34px;height:18px;border-radius:999px;background:rgba(246,239,221,.2);position:relative}.toggle.on{background:var(--gold)}.knob{width:14px;height:14px;border-radius:50%;position:absolute;top:2px;left:2px;background:var(--cream);transition:transform .15s}.toggle.on .knob{transform:translateX(16px)}.speeds{display:flex;gap:8px;margin-top:12px}.speed{flex:1;border-radius:12px;padding:10px 6px;background:rgba(246,239,221,.1);color:var(--cream)}.speed.active{background:var(--cream);color:var(--ink)}.speed strong{display:block;font-size:14px}.speed span{display:block;font-size:10px;margin-top:2px;opacity:.75}
.icon{display:inline-flex;vertical-align:middle}.award{color:var(--lavender)}
.sparkle-burst,.mastered-burst,.flawless-burst{position:absolute;inset:0;pointer-events:none;overflow:visible}.spark{position:absolute;opacity:0;animation:sparklePop var(--dur-sparkle,385ms) ease-out forwards}.s1{top:8%;left:16%}.s2{top:12%;right:14%;animation-delay:60ms}.s3{bottom:16%;left:48%;animation-delay:110ms}.tick{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);opacity:0;animation:tickPop var(--dur-tick,286ms) ease-out forwards;animation-delay:40ms}
.mastered-glow{animation:masteredGlow var(--dur-mastery,935ms) ease-out}.mastered-icon{position:absolute;opacity:0;animation:masteredIconPop var(--dur-mastery,935ms) ease-out forwards}.tl{top:-4px;left:-4px}.tr{top:-4px;right:-4px;animation-delay:70ms}.bl{bottom:-4px;left:-4px;animation-delay:140ms}.br{bottom:-4px;right:-4px;animation-delay:210ms}.ribbon{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--purple);color:var(--cream);padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:ribbonIn var(--dur-mastery,935ms) cubic-bezier(.34,1.56,.64,1) forwards}.notation.mastered{animation:notationFlash var(--dur-mastery,935ms) ease-out}
.flawless-area{position:relative;display:flex;flex-direction:column;align-items:center;min-height:92px}.flawless-glow{position:absolute;width:150px;height:150px;top:-20px;border-radius:50%;background:radial-gradient(circle,rgba(207,168,75,.45),rgba(207,168,75,0) 70%);animation:flawlessGlow var(--dur-flawless,825ms) ease-out}.flawless-spark{position:absolute;opacity:0;animation:flawlessSparkPop var(--dur-flawless,825ms) ease-out forwards}.f1{top:0;left:6%}.f2{top:2%;right:4%;animation-delay:80ms}.f3{bottom:8%;left:0;animation-delay:160ms}.f4{bottom:2%;right:8%;animation-delay:240ms}.f5{top:42%;left:-6%;animation-delay:320ms}.f6{top:40%;right:-6%;animation-delay:400ms}.trophy{font-size:44px;position:relative;animation:flawlessTrophyPop 900ms cubic-bezier(.34,1.56,.64,1)}.flawless-text{font:bold 14px Fraunces,serif;letter-spacing:.16em;color:var(--gold);margin-top:8px;position:relative;animation:flawlessTextIn 700ms ease-out 200ms both}
@keyframes dealIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}.wrong{animation:shakeX var(--dur-shake,231ms) ease-in-out}
@keyframes sparklePop{0%{opacity:0;transform:scale(.3) rotate(0)}40%{opacity:1;transform:scale(1.15) rotate(15deg)}100%{opacity:0;transform:scale(.9) rotate(25deg) translateY(-14px)}}@keyframes tickPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes masteredGlow{0%{box-shadow:0 0 0 0 rgba(139,111,209,0)}30%{box-shadow:0 0 34px 8px rgba(139,111,209,.55)}100%{box-shadow:0 0 0 0 rgba(139,111,209,0)}}@keyframes masteredIconPop{0%{opacity:0;transform:scale(.4)}35%{opacity:1;transform:scale(1.2) rotate(-12deg)}100%{opacity:0;transform:scale(.9) rotate(-20deg) translateY(-12px)}}@keyframes ribbonIn{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}55%{opacity:1;transform:translate(-50%,-6px) scale(1.08)}75%{opacity:1;transform:translate(-50%,0) scale(.97)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}@keyframes notationFlash{0%,70%{color:var(--lavender);background:rgba(139,111,209,.3)}100%{color:var(--gold);background:rgba(246,239,221,.1)}}@keyframes flawlessGlow{0%{opacity:0;transform:scale(.6)}40%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.3)}}@keyframes flawlessSparkPop{0%{opacity:0;transform:scale(.3) rotate(0) translateY(0)}40%{opacity:1;transform:scale(1.3) rotate(20deg) translateY(-6px)}100%{opacity:0;transform:scale(.9) rotate(35deg) translateY(-26px)}}@keyframes flawlessTrophyPop{0%{opacity:0;transform:scale(.5) rotate(-8deg)}60%{opacity:1;transform:scale(1.15) rotate(4deg)}100%{opacity:1;transform:scale(1)}}@keyframes flawlessTextIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:520px){.stats{gap:8px}.stat{padding:12px}.stat-value{font-size:26px}.tab{padding:8px 11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const RANKS = ["A","K","Q","J","T","9","8","7","6","5","4","3","2"];
const ACTION_GRID = {
A:["R","R","R","R","R","R","R","R","R","R","R","R","C"],
K:["R","R","R","R","R","R","C","C","C","C","C","F","F"],
Q:["R","R","R","R","R","R","C","C","C","F","F","F","F"],
J:["R","R","R","R","R","R","C","C","F","F","F","F","F"],
T:["R","R","C","C","R","R","C","C","F","F","F","F","F"],
9:["R","C","C","F","F","R","C","C","F","F","F","F","F"],
8:["C","F","F","F","F","F","R","C","F","F","F","F","F"],
7:["C","F","F","F","F","F","F","R","C","F","F","F"],
6:["F","F","F","F","F","F","F","F","R","F","F","F"],
5:["F","F","F","F","F","F","F","F","F","C","F","F","F"],
4:["F","F","F","F","F","F","F","F","F","F","C","F","F"],
3:["F","F","F","F","F","F","F","F","F","F","F","C","F"],
2:["F","F","F","F","F","F","F","F","F","F","F","F","C"]};
const CATEGORY_LABEL={pair:"Pairs",suited:"Suited",offsuit:"Offsuit"}, ACTION_WORD={R:"Raise",C:"Call",F:"Fold"};
const HISTORY_KEY="poker-ev-history-v1", SETTINGS_KEY="poker-ev-settings-v1", RUN_SIZE=20, REDEMPTION_WINDOW=10;
const DIFFICULTY_CAP=10,DIFFICULTY_WRONG_STEP=3,DIFFICULTY_CORRECT_STEP=1,MASTERY_MIN_ATTEMPTS=5,MASTERY_ACCURACY=.8,MASTERED_WEIGHT_MULTIPLIER=.15,NEAR_MASTERY_BOOST=1.6;
const SPEED_PRESETS={relaxed:{label:"Relaxed",blurb:"Original pacing",factor:1},quick:{label:"Quick",blurb:"Faster transitions",factor:.55},instant:{label:"Instant",blurb:"Minimal delay, snap to next hand",factor:.25}};
const BASE_DURATIONS={deal:240,shake:420,sparkle:700,tick:520,advance:900,mastery:1700,flawless:1500};
function durationsForSpeed(k){let f=(SPEED_PRESETS[k]||SPEED_PRESETS.quick).factor;return{deal:Math.round(BASE_DURATIONS.deal*f),shake:Math.round(BASE_DURATIONS.shake*f),sparkle:Math.round(BASE_DURATIONS.sparkle*f),tick:Math.round(BASE_DURATIONS.tick*f),advance:Math.max(150,Math.round(BASE_DURATIONS.advance*f)),mastery:Math.round(BASE_DURATIONS.mastery*f),flawless:Math.round(BASE_DURATIONS.flawless*f)}}
const SUITS=["♠","♥","♦","♣"];
function emptyCatTotals(){return{pair:{correct:0,total:0},suited:{correct:0,total:0},offsuit:{correct:0,total:0}}}
function defaultHistory(){return{runs:[],aggregate:emptyCatTotals(),difficulty:{},handStats:{},flawlessRuns:0}}
function defaultSettings(){return{autoAdvance:false,animationSpeed:"quick"}}
function handAccuracy(s){return!s||!s.total?null:s.correct/s.total}
function isMastered(s){let a=handAccuracy(s);return a!==null&&s.total>=MASTERY_MIN_ATTEMPTS&&a>=MASTERY_ACCURACY}
function masteryProximity(s){if(!s||!s.total||isMastered(s))return 0;return Math.min(s.total/MASTERY_MIN_ATTEMPTS,1)*Math.min((handAccuracy(s)||0)/MASTERY_ACCURACY,1)}
function weightForHand(id,diff,stats){let d=Math.min(diff[id]||0,DIFFICULTY_CAP),s=stats[id],base=1+d;if(isMastered(s))return base*MASTERED_WEIGHT_MULTIPLIER;return base*(1+masteryProximity(s)*NEAR_MASTERY_BOOST)}
function weightedSample(items,fn,n){let scored=items.map(item=>({item,key:Math.pow(Math.random(),1/Math.max(fn(item),.0001))}));scored.sort((a,b)=>b.key-a.key);return scored.slice(0,n).map(x=>x.item)}
function assignSuits(cat){if(cat==="suited"){let s=SUITS[Math.floor(Math.random()*4)];return[s,s]}let a=Math.floor(Math.random()*4),b=Math.floor(Math.random()*4);while(b===a)b=Math.floor(Math.random()*4);return[SUITS[a],SUITS[b]]}
function buildPool(){let p=[];for(let i=0;i<13;i++)for(let j=0;j<13;j++){let r1=RANKS[i],r2=RANKS[j],cat,notation;if(i===j){cat="pair";notation=r1+r1}else if(i<j){cat="suited";notation=r1+r2+"s"}else{cat="offsuit";notation=r2+r1}p.push({id:`${i}-${j}`,notation,category:cat,action:ACTION_GRID[r1][j]})}return p}
const POOL=buildPool();
function buildDeck(){return weightedSample(POOL,h=>weightForHand(h.id,state.history.difficulty,state.history.handStats),RUN_SIZE).map(h=>({...h,suits:assignSuits(h.category)}))}
function pct(c,t){return t?Math.round(c/t*100):null}
function addCats(a,b){let o=emptyCatTotals();for(let k of["pair","suited","offsuit"]){o[k].correct=a[k].correct+b[k].correct;o[k].total=a[k].total+b[k].total}return o}
function summarize(log){let cats=emptyCatTotals(),correct=0;for(let a of log){cats[a.category].total++;if(a.correct){cats[a.category].correct++;correct++}}return{correct,total:log.length,cats}}
function load(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}}
function save(key,v){try{localStorage.setItem(key,JSON.stringify(v))}catch{}}
let state={ready:false,history:load(HISTORY_KEY,defaultHistory()),settings:{...defaultSettings(),...load(SETTINGS_KEY,defaultSettings())},activeTab:"quiz",phase:"quiz",deck:[],idx:0,chosen:null,summary:null,resetConfirm:false,justMastered:null,redemptionQueue:[],redemptionIdx:0,redemptionChosen:null,runLog:[],redemptionLog:[]};
state.deck=buildDeck();state.ready=true;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function icon(type,size=18){let paths={check:`<path d="m5 12 4 4L19 6"/>`,x:`<path d="m6 6 12 12M18 6 6 18"/>`,arrow:`<path d="M5 12h14M13 6l6 6-6 6"/>`,trophy:`<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM4 5h3v2a3 3 0 0 1-3 3V5Zm16 0h-3v2a3 3 0 0 0 3 3V5Z"/>`,rotate:`<path d="M3 12a9 9 0 0 1 15-6l2 2M20 4v5h-5M21 12a9 9 0 0 1-15 6l-2-2M4 20v-5h5"/>`,award:`<circle cx="12" cy="8" r="5"/><path d="m8 12-1 9 5-3 5 3-1-9"/>`,spark:`<path d="m12 3-1.5 5.5L5 10l5.5 1.5L12 17l1.5-5.5L19 10l-5.5-1.5L12 3Z"/>`};return`<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths[type]||""}</svg>`}
function tabButton(k,label){return`<button class="tab ${state.activeTab===k?"active":""}" data-tab="${k}">${label}</button>`}
function render(){let d=durationsForSpeed(state.settings.animationSpeed),a=document.getElementById("app");a.style.setProperty("--dur-deal",d.deal+"ms");a.style.setProperty("--dur-shake",d.shake+"ms");a.style.setProperty("--dur-sparkle",d.sparkle+"ms");a.style.setProperty("--dur-tick",d.tick+"ms");a.style.setProperty("--dur-mastery",d.mastery+"ms");a.style.setProperty("--dur-flawless",d.flawless+"ms");
a.innerHTML=`<div class="shell"><header><div><h1>The Felt</h1><div class="subtitle">Preflop range trainer</div></div><nav>${tabButton("quiz","Quiz")}${tabButton("history","History")}${tabButton("settings",icon("gear",14))}</nav></header><main>${!state.ready?`<div style="text-align:center;padding:80px 0;color:var(--muted)">Shuffling the deck…</div>`:renderMain()}</main></div>`;bind()}
function renderMain(){if(state.activeTab==="history")return renderHistory();if(state.activeTab==="settings")return renderSettings();if(state.phase==="redemption")return renderRedemption();if(state.phase==="summary")return renderSummary();return renderQuiz()}
function renderCards(hand,mastering=false){let ranks=hand.notation.replace("s","");return`<div class="deal-in ${state.chosen&&state.chosen!==hand.action?"wrong":""} ${mastering?"mastered-glow":""} panel" style="margin:32px 0 24px"><div class="cards"><div class="mini-card" style="transform:rotate(-6deg);color:${["♥","♦"].includes(hand.suits[0])?"#A5342A":"var(--ink)"}"><span class="rank">${ranks[0]}</span><span class="suit">${hand.suits[0]}</span></div><div class="mini-card" style="transform:rotate(6deg);color:${["♥","♦"].includes(hand.suits[1])?"#A5342A":"var(--ink)"}"><span class="rank">${ranks[1]}</span><span class="suit">${hand.suits[1]}</span></div></div><div class="notation ${mastering?"mastered":""}">${esc(hand.notation)}</div>${state.chosen===hand.action?`<div class="sparkle-burst">${icon("spark",18)}${icon("spark",16)}${icon("spark",18)}<span class="tick">${icon("check",38)}</span></div>`:""}${mastering?`<div class="ribbon">${icon("award",12)} Hand mastered</div><div class="mastered-burst">${["tl","tr","bl","br"].map(x=>`<span class="mastered-icon ${x} award">${icon("award",16)}</span>`).join("")}</div>`:""}</div>`}
function chip(action,chosen,current){let cls=action==="R"?"raise":action==="C"?"call":"fold";let st=!chosen?"":chosen===action?"chosen":current===action?"hint":"dim";return`<button class="chip ${cls} ${st}" ${chosen?"disabled":""} data-action="${action}"><span class="chip-label">${ACTION_WORD[action]}</span></button>`}
function renderQuiz(){let h=state.deck[state.idx],correct=state.runLog.filter(x=>x.correct).length,mastering=state.justMastered&&state.justMastered.id===h.id;return`<div><div class="row mb"><span class="muted" style="font-size:14px">Hand ${state.idx+1} of ${RUN_SIZE}</span><span class="muted" style="font-size:14px">${correct} correct so far</span></div><div class="progress"><div style="width:${(state.idx+(state.chosen?1:0))/RUN_SIZE*100}%"></div></div>${renderCards(h,mastering)}<div class="actions">${chip("R",state.chosen,h.action)}${chip("C",state.chosen,h.action)}${chip("F",state.chosen,h.action)}</div>${state.chosen?`<div class="feedback">${state.chosen===h.action?icon("check",18):icon("x",18)}<span>${state.chosen===h.action?`Correct — ${ACTION_WORD[h.action]} is right here.`:`Not quite. The chart says ${ACTION_WORD[h.action]}.`}</span></div>`:""}<button class="primary" id="next" ${!state.chosen?"disabled":""}>${state.idx+1<state.deck.length?"Next hand":"See results"} ${icon("arrow",16)}</button></div>`}
function renderRedemption(){let h=state.redemptionQueue[state.redemptionIdx],mastering=state.justMastered&&state.justMastered.id===h.id;return`<div><div class="banner"><div class="banner-title">${icon("rotate",14)} Redemption round</div><p>A chance to fix mistakes from your first ${REDEMPTION_WINDOW} hands. This doesn't change the score from your run — getting it right just softens that hand's miss.</p></div><div class="muted mb" style="font-size:14px">Redemption ${state.redemptionIdx+1} of ${state.redemptionQueue.length}</div><div class="progress"><div style="width:${(state.redemptionIdx+(state.redemptionChosen?1:0))/state.redemptionQueue.length*100}%"></div></div>${renderCards(h,mastering).replace(/state\\.chosen/g,"state.redemptionChosen")}<div class="actions">${chipRed("R",state.redemptionChosen,h.action)}${chipRed("C",state.redemptionChosen,h.action)}${chipRed("F",state.redemptionChosen,h.action)}</div>${state.redemptionChosen?`<div class="feedback">${state.redemptionChosen===h.action?icon("check",18):icon("x",18)}<span>${state.redemptionChosen===h.action?"Redeemed — that mistake's impact just got lighter.":`Not quite. The chart says ${ACTION_WORD[h.action]}.`}</span></div>`:""}<button class="primary" id="rednext" ${!state.redemptionChosen?"disabled":""}>${state.redemptionIdx+1<state.redemptionQueue.length?"Next redemption":"See results"} ${icon("arrow",16)}</button></div>`}
function chipRed(action,chosen,current){let cls=action==="R"?"raise":action==="C"?"call":"fold",st=!chosen?"":chosen===action?"chosen":current===action?"hint":"dim";return`<button class="chip ${cls} ${st}" ${chosen?"disabled":""} data-red-action="${action}"><span class="chip-label">${ACTION_WORD[action]}</span></button>`}
function renderSummary(){let s=state.summary;return`<div class="summary">${s.flawless?`<div class="flawless-area"><div class="flawless-glow"></div>${icon("spark",18)}<div class="trophy">${icon("trophy",44)}</div><div class="flawless-text">FLAWLESS RUN</div></div>`:icon("trophy",36)}<h2>Run complete</h2><div class="score">${s.correct}/${s.total}</div><div class="small">${pct(s.correct,s.total)}% correct this run</div>${s.redemption?`<div class="banner" style="text-align:left"><div class="banner-title">${icon("rotate",14)} Redemption round</div><p style="color:var(--cream);font-size:14px">Corrected ${s.redemption.redeemed} of ${s.redemption.attempted} early mistakes.</p><p>Doesn't change the score above — it just softens those hands' impact going forward.</p></div>`:""}${categoryTable(s.cats,null)}<div class="actions" style="margin-top:24px"><button class="primary" id="newrun">New run</button><button class="secondary" id="historybtn">View history</button></div></div>`}
function categoryTable(overall,last){return`<div class="table" style="text-align:left">${`<div class="table-head"><span>Category</span><span class="right">Overall</span><span class="right">Last run</span></div>`}${["pair","suited","offsuit"].map(k=>{let o=overall[k],l=last&&last[k],op=pct(o.correct,o.total),lp=l?pct(l.correct,l.total):null;return`<div class="table-row"><span>${CATEGORY_LABEL[k]}</span><span class="right">${op===null?"—":op+"% ("+o.correct+"/"+o.total+")"}</span><span class="right" style="color:var(--gold)">${lp===null?"—":lp+"% ("+l.correct+"/"+l.total+")"}</span></div>`}).join("")}</div>`}
function renderHistory(){let h=state.history,tot=["pair","suited","offsuit"].reduce((s,k)=>s+h.aggregate[k].total,0),cor=["pair","suited","offsuit"].reduce((s,k)=>s+h.aggregate[k].correct,0),last=h.runs[0]||null;return`<div><div class="stats"><div class="stat"><div class="stat-label">Overall accuracy</div><div class="stat-value">${pct(cor,tot)??"—"}${tot?"%":""}</div><p>${cor}/${tot} hands</p></div><div class="stat"><div class="stat-label">Last run</div><div class="stat-value" style="color:var(--gold)">${last?pct(last.correct,last.total)+"%":"—"}</div><p>${last?last.correct+"/"+last.total+" hands":"No runs yet"}</p></div><div class="stat gold"><div class="stat-label">${icon("trophy",11)} Flawless runs</div><div class="stat-value" style="color:var(--gold)">${h.flawlessRuns||0}</div><p>No mistakes, start to finish</p></div></div><p class="section-label">Accuracy trend</p>${trend(h.runs)}<p class="section-label">Breakdown</p>${categoryTable(h.aggregate,last?last.cats:null)}<p class="section-label" style="margin-top:20px">Accuracy by hand</p><div class="chart">${heatmap(h.handStats||{})}</div><p class="section-label">Run log</p><div class="runlog">${h.runs.length?h.runs.slice(0,10).map(r=>`<div class="runitem"><span class="muted">${new Date(r.timestamp).toLocaleDateString(undefined,{month:"short",day:"numeric"})} ${new Date(r.timestamp).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</span><span>${r.flawless?'<span class="flawless-tag">Flawless</span> ':""}${r.correct}/${r.total} · ${pct(r.correct,r.total)}%</span></div>`).join(""):`<p class="muted" style="padding:16px;font-size:14px">Finish a run to see it logged here.</p>`}</div><button class="secondary" id="reset">${state.resetConfirm?"Confirm reset — this can't be undone":icon("rotate",14)+" Reset history"}</button></div>`}
function heatmap(stats){let out=`<div class="heat-wrap"><div class="heat"><div></div>${RANKS.map(r=>`<div class="heat-col">${r}</div>`).join("")}`;for(let i=0;i<13;i++){out+=`<div class="heat-label">${RANKS[i]}</div>`;for(let j=0;j<13;j++){let id=`${i}-${j}`,s=stats[id],acc=s&&s.total?s.correct/s.total:null,master=isMastered(s),bg=master?"var(--purple)":acc===null?"rgba(246,239,221,.12)":acc<.5?mix("#B8463B","#D7A73B",acc/.5):mix("#D7A73B","#2E8B63",(acc-.5)/.5),notation=i===j?RANKS[i]+RANKS[j]:i<j?RANKS[i]+RANKS[j]+"s":RANKS[j]+RANKS[i];out+=`<div class="heat-cell" title="${notation}: ${master?"Mastered ("+Math.round(acc*100)+"%, "+s.total+" seen)":acc===null?"not seen yet":Math.round(acc*100)+"% ("+s.total+" seen)"}" style="background:${bg}"></div>`}}return out+`</div></div><div class="legend"><span>0%</span><div class="gradient"></div><span>100%</span><span style="width:10px;height:10px;border-radius:2px;background:var(--purple);display:inline-block;margin-left:12px"></span><span>mastered</span><span style="width:10px;height:10px;border-radius:2px;background:rgba(246,239,221,.12);border:1px solid rgba(246,239,221,.25);display:inline-block;margin-left:12px"></span><span>no data</span></div>`}
function mix(a,b,t){let pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16),r=Math.round(((pa>>16)&255)+(((pb>>16)&255)-((pa>>16)&255))*t),g=Math.round(((pa>>8)&255)+(((pb>>8)&255)-((pa>>8)&255))*t),bl=Math.round((pa&255)+((pb&255)-(pa&255))*t);return`rgb(${r},${g},${bl})`}
function trend(runs){if(!runs.length)return`<div class="chart muted" style="text-align:center;padding:24px">Finish a few runs to see your trend.</div>`;let data=runs.slice(0,20).reverse(),W=320,H=120,PL=26,PR=8,PT=10,PB=8,iw=W-PL-PR,ih=H-PT-PB,step=data.length>1?iw/(data.length-1):0,x=i=>PL+i*step,y=p=>PT+ih-(p/100)*ih,points=data.map((r,i)=>`${x(i)},${y(pct(r.correct,r.total)||0)}`).join(" ");return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${[0,25,50,75,100].map(g=>`<g><line x1="${PL}" x2="${W-PR}" y1="${y(g)}" y2="${y(g)}" stroke="rgba(246,239,221,.1)"/><text x="${PL-5}" y="${y(g)+3}" text-anchor="end" font-size="8" fill="rgba(246,239,221,.62)">${g}</text></g>`).join("")}${data.length>1?`<polyline points="${points}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:""}${data.map((r,i)=>`<circle cx="${x(i)}" cy="${y(pct(r.correct,r.total)||0)}" r="${data.length===1?3.5:2.5}" fill="var(--gold)"/>`).join("")}</svg><div class="row muted" style="font-size:10px"><span>${data.length>1?"Last "+data.length+" runs":"First run"}</span><span style="color:var(--gold)">${pct(data.at(-1).correct,data.at(-1).total)}% most recent</span></div></div>`}
function renderSettings(){return`<div><div class="setting"><div class="row"><div><div class="setting-title">Auto-advance</div><div class="setting-desc">Skip to the next hand automatically after a correct answer.</div></div><button class="toggle ${state.settings.autoAdvance?"on":""}" id="toggle"><span class="knob"></span></button></div></div><div class="setting"><div class="setting-title">Animation speed</div><div class="setting-desc">Controls how fast the deal-in, right/wrong effects, and auto-advance delay play out.</div><div class="speeds">${Object.entries(SPEED_PRESETS).map(([k,v])=>`<button class="speed ${state.settings.animationSpeed===k?"active":""}" data-speed="${k}"><strong>${v.label}</strong><span>${v.blurb}</span></button>`).join("")}</div></div><p class="muted" style="font-size:12px;padding:0 4px">More settings will land here as the trainer grows.</p></div>`}
function answer(action){if(state.chosen)return;let h=state.deck[state.idx],correct=action===h.action;state.runLog.push({id:h.id,notation:h.notation,category:h.category,correctAction:h.action,chosen:action,correct});state.chosen=action;let old=state.history.handStats[h.id],was=isMastered(old),base=old||{correct:0,total:0},next={correct:base.correct+(correct?1:0),total:base.total+1};state.history.difficulty[h.id]=correct?Math.max(0,(state.history.difficulty[h.id]||0)-1):Math.min(10,(state.history.difficulty[h.id]||0)+3);state.history.handStats[h.id]=next;save(HISTORY_KEY,state.history);if(correct&&!was&&isMastered(next))state.justMastered={id:h.id,notation:h.notation};render();if(correct&&state.settings.autoAdvance)setTimeout(nextHand,durationsForSpeed(state.settings.animationSpeed).advance)}
function nextHand(){if(!state.chosen)return;state.justMastered=null;if(state.idx+1<state.deck.length){state.idx++;state.chosen=null;render()}else finishRun()}
function finishRun(){let s=summarize(state.runLog),flawless=s.total>0&&s.correct===s.total,record={id:Date.now(),timestamp:new Date().toISOString(),correct:s.correct,total:s.total,cats:s.cats,flawless};if(flawless){for(let a of state.runLog){let st=state.history.handStats[a.id]||{correct:0,total:0};state.history.handStats[a.id]={correct:st.correct+1,total:st.total+1};state.history.difficulty[a.id]=Math.max(0,(state.history.difficulty[a.id]||0)-1)}}state.history.runs=[record,...state.history.runs].slice(0,200);state.history.aggregate=addCats(state.history.aggregate,s.cats);if(flawless)state.history.flawlessRuns=(state.history.flawlessRuns||0)+1;save(HISTORY_KEY,state.history);state.summary=record;let candidates=state.runLog.slice(0,10).filter(a=>!a.correct).map(a=>({...a,action:a.correctAction,suits:assignSuits(a.category)}));if(candidates.length){state.redemptionQueue=candidates;state.redemptionIdx=0;state.redemptionChosen=null;state.redemptionLog=[];state.phase="redemption"}else state.phase="summary";render()}
function redAnswer(action){if(state.redemptionChosen)return;let h=state.redemptionQueue[state.redemptionIdx],correct=action===h.action;state.redemptionChosen=action;state.redemptionLog.push({id:h.id,notation:h.notation,correct});if(correct){let st=state.history.handStats[h.id]||{correct:0,total:0},was=isMastered(st),next={correct:st.correct+1,total:st.total+1};state.history.handStats[h.id]=next;state.history.difficulty[h.id]=Math.max(0,(state.history.difficulty[h.id]||0)-1);save(HISTORY_KEY,state.history);if(!was&&isMastered(next))state.justMastered={id:h.id,notation:h.notation}}render();if(correct&&state.settings.autoAdvance)setTimeout(redNext,durationsForSpeed(state.settings.animationSpeed).advance)}
function redNext(){if(!state.redemptionChosen)return;state.justMastered=null;if(state.redemptionIdx+1<state.redemptionQueue.length){state.redemptionIdx++;state.redemptionChosen=null;render()}else{state.summary={...state.summary,redemption:{attempted:state.redemptionQueue.length,redeemed:state.redemptionLog.filter(x=>x.correct).length}};state.phase="summary";render()}}
function newRun(){state.runLog=[];state.redemptionLog=[];state.deck=buildDeck();state.idx=0;state.chosen=null;state.summary=null;state.justMastered=null;state.redemptionQueue=[];state.redemptionIdx=0;state.redemptionChosen=null;state.phase="quiz";state.activeTab="quiz";render()}
function bind(){document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.activeTab=b.dataset.tab;render()});document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>answer(b.dataset.action));document.querySelectorAll("[data-red-action]").forEach(b=>b.onclick=()=>redAnswer(b.dataset.redAction));document.getElementById("next")?.addEventListener("click",nextHand);document.getElementById("rednext")?.addEventListener("click",redNext);document.getElementById("newrun")?.addEventListener("click",newRun);document.getElementById("historybtn")?.addEventListener("click",()=>{state.activeTab="history";render()});document.getElementById("toggle")?.addEventListener("click",()=>{state.settings.autoAdvance=!state.settings.autoAdvance;save(SETTINGS_KEY,state.settings);render()});document.querySelectorAll("[data-speed]").forEach(b=>b.onclick=()=>{state.settings.animationSpeed=b.dataset.speed;save(SETTINGS_KEY,state.settings);render()});document.getElementById("reset")?.addEventListener("click",()=>{if(!state.resetConfirm){state.resetConfirm=true;render()}else{state.history=defaultHistory();save(HISTORY_KEY,state.history);state.resetConfirm=false;render()}})}
window.addEventListener("keydown",e=>{if(state.activeTab!=="quiz")return;let k=e.key.toLowerCase();if(state.phase==="quiz"){if(!state.chosen&&["r","c","f"].includes(k))answer(k.toUpperCase());else if(state.chosen&&(k==="enter"||k===" "||k==="arrowright")){e.preventDefault();nextHand()}}else if(state.phase==="redemption"){if(!state.redemptionChosen&&["r","c","f"].includes(k))redAnswer(k.toUpperCase());else if(state.redemptionChosen&&(k==="enter"||k===" "||k==="arrowright")){e.preventDefault();redNext()}}});
render();
</script>
</body>
</html>
